name: Build AppImage and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build application
        run: |
          python -m PyInstaller \
            --clean --noconfirm --onedir --windowed --strip \
            --name joulescalc \
            --exclude-module PyQt6.Qt3DAnimation \
            --exclude-module PyQt6.Qt3DCore \
            --exclude-module PyQt6.Qt3DExtras \
            --exclude-module PyQt6.Qt3DInput \
            --exclude-module PyQt6.Qt3DRender \
            --exclude-module PyQt6.QtBluetooth \
            --exclude-module PyQt6.QtCharts \
            --exclude-module PyQt6.QtDataVisualization \
            --exclude-module PyQt6.QtGraphs \
            --exclude-module PyQt6.QtLocation \
            --exclude-module PyQt6.QtMultimedia \
            --exclude-module PyQt6.QtNetwork \
            --exclude-module PyQt6.QtNfc \
            --exclude-module PyQt6.QtOpenGL \
            --exclude-module PyQt6.QtOpenGLWidgets \
            --exclude-module PyQt6.QtPdf \
            --exclude-module PyQt6.QtPdfWidgets \
            --exclude-module PyQt6.QtPositioning \
            --exclude-module PyQt6.QtPrintSupport \
            --exclude-module PyQt6.QtQml \
            --exclude-module PyQt6.QtQuick \
            --exclude-module PyQt6.QtQuickControls2 \
            --exclude-module PyQt6.QtQuickWidgets \
            --exclude-module PyQt6.QtRemoteObjects \
            --exclude-module PyQt6.QtSensors \
            --exclude-module PyQt6.QtSerialBus \
            --exclude-module PyQt6.QtSerialPort \
            --exclude-module PyQt6.QtSpatialAudio \
            --exclude-module PyQt6.QtSql \
            --exclude-module PyQt6.QtSvg \
            --exclude-module PyQt6.QtSvgWidgets \
            --exclude-module PyQt6.QtTest \
            --exclude-module PyQt6.QtTextToSpeech \
            --exclude-module PyQt6.QtWebChannel \
            --exclude-module PyQt6.QtWebEngineCore \
            --exclude-module PyQt6.QtWebEngineWidgets \
            --exclude-module PyQt6.QtWebSockets \
            --exclude-module PyQt6.QtXml \
            JoulesCalc.py

      - name: Remove unused Qt plugins
        run: |
          find dist/joulescalc -type d \
            \( -path '*/plugins/imageformats' \
            -o -path '*/plugins/iconengines' \
            -o -path '*/plugins/sqldrivers' \
            -o -path '*/plugins/tls' \
            -o -path '*/plugins/networkinformation' \) \
            -prune -exec rm -rf {} +

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/lib/joulescalc AppDir/usr/share/applications
          cp -a dist/joulescalc/. AppDir/usr/lib/joulescalc/
          cp Icon-joulestocalc.png AppDir/joulescalc.png

          cat > AppDir/AppRun <<'EOF'
          #!/usr/bin/env sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/lib/joulescalc/joulescalc" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/joulescalc.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Calculadora de Joules
          Comment=Calcula energia em joules
          Exec=joulescalc
          Icon=joulescalc
          Terminal=false
          Categories=Utility;Education;
          EOF

          cp AppDir/joulescalc.desktop AppDir/usr/share/applications/

      - name: Build AppImage
        run: |
          curl -fL \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o appimagetool
          chmod +x appimagetool
          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            ./appimagetool --comp xz AppDir dist/JoulesCalc-x86_64.AppImage
          sha256sum dist/JoulesCalc-x86_64.AppImage > dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/JoulesCalc-x86_64.AppImage
            dist/SHA256SUMS
