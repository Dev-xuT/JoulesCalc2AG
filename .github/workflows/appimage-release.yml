name: Build AppImage and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build application
        run: |
          python -m PyInstaller \
            --clean --noconfirm --onedir --windowed \
            --name joulescalc JoulesCalc.py

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib/joulescalc AppDir/usr/share/applications
          cp -a dist/joulescalc/. AppDir/usr/lib/joulescalc/
          cp Icon-joulestocalc.png AppDir/joulescalc.png

          cat > AppDir/AppRun <<'EOF'
          #!/usr/bin/env sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/lib/joulescalc/joulescalc" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/joulescalc.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Calculadora de Joules
          Comment=Calcula energia em joules
          Exec=joulescalc
          Icon=joulescalc
          Terminal=false
          Categories=Utility;Education;
          EOF

          cp AppDir/joulescalc.desktop AppDir/usr/share/applications/

      - name: Build AppImage
        run: |
          curl -fL \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o appimagetool
          chmod +x appimagetool
          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            ./appimagetool AppDir dist/JoulesCalc-x86_64.AppImage
          sha256sum dist/JoulesCalc-x86_64.AppImage > dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/JoulesCalc-x86_64.AppImage
            dist/SHA256SUMS
